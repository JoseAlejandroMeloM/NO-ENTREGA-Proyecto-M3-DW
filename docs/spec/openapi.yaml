openapi: 3.0.3
info:
  title: Conecta Negocio API
  version: 1.0.0
  description: |
    Integration contract between the Conecta Negocio frontend (React) and backend (Express).
    Contract-first: the backend must implement exactly these paths, field names and status codes.

    **Auth:** send `Authorization: Bearer <accessToken>` (JWT HS256, 15 min).
    **Errors:** every error uses the `Error` schema.
    **Pagination:** list endpoints accept `page` (default 1) and `limit` (default 20, max 100).
    **Roles:** `store_owner`, `store_inventory`, `store_cashier`, `distributor_owner`, `distributor_staff`.
servers:
  - url: /api
    description: Same origin as the frontend (Vercel / Render)
tags:
  - name: Health
  - name: Auth
  - name: Users
  - name: Organizations
  - name: Products
  - name: Sales
  - name: Insights
  - name: Distributors
  - name: Catalog
  - name: Orders
  - name: Messages
  - name: Notifications
security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [Health]
      summary: Smoke check (app + database)
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  db: { type: string, enum: [connected, disconnected] }
                  version: { type: string, example: 1.0.0 }

  # ---------------- Auth ----------------
  /auth/register-store:
    post:
      tags: [Auth]
      summary: Register a store and its owner (US-01). Rate limited to 20 registrations / hour / IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterStoreInput' }
      responses:
        '201': { $ref: '#/components/responses/AuthOk' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/register-distributor:
    post:
      tags: [Auth]
      summary: Register a distributor and its owner (US-02). 409 for a duplicate email or NIT.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterDistributorInput' }
      responses:
        '201': { $ref: '#/components/responses/AuthOk' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/login:
    post:
      tags: [Auth]
      summary: Log in (US-03). Rate limited to 5 failed attempts / 15 min / IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200': { $ref: '#/components/responses/AuthOk' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/me:
    get:
      tags: [Auth]
      summary: Current user and organization
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ---------------- Users (employees) ----------------
  /users:
    get:
      tags: [Users]
      summary: List employees of my organization (owners only) (US-04)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/User' } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Users]
      summary: Create an employee (store_owner → store_inventory|store_cashier; distributor_owner → distributor_staff)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateEmployeeInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /users/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    patch:
      tags: [Users]
      summary: Activate / deactivate an employee (owners only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active]
              properties:
                active: { type: boolean }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: An owner cannot deactivate their own account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ---------------- Organizations ----------------
  /stores/me:
    get:
      tags: [Organizations]
      summary: My store profile (store roles)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Store' }
    patch:
      tags: [Organizations]
      summary: Update my store (store_owner). Partial update; send at least one field.
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StoreInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Store' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /distributors/me:
    get:
      tags: [Organizations]
      summary: My distributor profile (distributor roles)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Distributor' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [Organizations]
      summary: Update my distributor profile (distributor_owner). Partial update; 409 if the NIT belongs to another distributor.
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DistributorInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Distributor' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------- Products ----------------
  /products:
    get:
      tags: [Products]
      summary: List my store's products (store_owner, store_inventory, store_cashier) (US-10)
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: q, in: query, schema: { type: string, maxLength: 80 }, description: Search by name or SKU }
        - { name: category, in: query, schema: { $ref: '#/components/schemas/Category' } }
        - { name: lowStock, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Product' } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Products]
      summary: Create a product (store_owner, store_inventory)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /products/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [Products]
      summary: Product detail
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Products]
      summary: Update a product (store_owner, store_inventory). Stock cannot be changed here — use adjustments.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductUpdateInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Products]
      summary: Soft-delete a product (store_owner, store_inventory)
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /products/{id}/adjustments:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      tags: [Products]
      summary: Adjust stock with a reason (US-11)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity, reason]
              properties:
                quantity: { type: integer, description: 'Signed: +10 adds, -3 removes', not: { enum: [0] } }
                reason: { type: string, enum: [count, damage, other] }
                note: { type: string, maxLength: 200 }
      responses:
        '200':
          description: Updated product
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400':
          description: Invalid data, or the adjustment would leave stock below 0 (stock is unchanged)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /products/{id}/movements:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [Products]
      summary: Stock movement history, newest first (US-11 AC2). All store roles.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/StockMovement' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------- Sales ----------------
  /sales:
    get:
      tags: [Sales]
      summary: Sales history (store_owner all; store_inventory read; store_cashier own sales only) (US-21)
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: from, in: query, schema: { type: string, format: date }, description: First day included (America/Bogota) }
        - { name: to, in: query, schema: { type: string, format: date }, description: Last day included (America/Bogota) }
        - { name: paymentMethod, in: query, schema: { $ref: '#/components/schemas/PaymentMethod' } }
        - { name: cashier, in: query, schema: { type: string }, description: User id (ignored for store_cashier, who always gets only their own sales) }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Sale' } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Sales]
      summary: Register a sale and its payment (store_owner, store_cashier) (US-20)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaleInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sale' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Insufficient stock for one or more items (`INSUFFICIENT_STOCK`, details name each item). Nothing is saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /sales/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [Sales]
      summary: Sale detail (a cashier gets 404 for other cashiers' sales)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sale' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /sales/{id}/void:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      tags: [Sales]
      summary: Void a sale (store_owner) — restores stock; excluded from totals and insights (BR2)
      description: The sale stays in the history with `voidedAt` and `voidReason`. Stock of every item comes back with a `void` movement, in one transaction. A product deleted after the sale is skipped.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 200, example: wrong product }
      responses:
        '200':
          description: Voided
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sale' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /sales/summary/daily:
    get:
      tags: [Sales]
      summary: Totals by payment method for one day (store_owner) (US-22)
      parameters:
        - { name: date, in: query, schema: { type: string, format: date }, description: Defaults to today (America/Bogota) }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DailySummary' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------- Insights ----------------
  /insights/best-sellers:
    get:
      tags: [Insights]
      summary: Top 10 products by units and revenue (store_owner, store_inventory) (US-13)
      parameters:
        - { $ref: '#/components/parameters/Days' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  days: { type: integer }
                  byUnits: { type: array, items: { $ref: '#/components/schemas/ProductStat' } }
                  byRevenue: { type: array, items: { $ref: '#/components/schemas/ProductStat' } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /insights/daily-sales:
    get:
      tags: [Insights]
      summary: 'Daily sales series: one point per America/Bogota day of the range, zero-filled, oldest first (store_owner, store_inventory) (US-13)'
      parameters:
        - { $ref: '#/components/parameters/Days' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        date: { type: string, format: date }
                        total: { type: integer }
                        count: { type: integer }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /insights/restock:
    get:
      tags: [Insights]
      summary: 'Every active product with its BR4 plan, sorted by days left (no sales last); `urgent` marks the ones to restock (store_owner, store_inventory) (US-14)'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  windowDays: { type: integer, example: 30 }
                  data: { type: array, items: { $ref: '#/components/schemas/RestockSuggestion' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------- Distributors ----------------
  /distributors:
    get:
      tags: [Distributors]
      summary: Distributor directory (store_owner, store_inventory, distributor users; cashiers 403) (US-31)
      description: '`category` lists only distributors with at least one available item in it. Sorted by rating, then name.'
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: q, in: query, schema: { type: string, maxLength: 80 } }
        - { name: category, in: query, schema: { $ref: '#/components/schemas/Category' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Distributor' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /distributors/compare:
    get:
      tags: [Distributors]
      summary: Compare distributors offering a product name or category (US-31)
      description: One row per distributor with its cheapest matching available item. `q` or `category` is required (400 otherwise).
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 80 }, description: Product name to match }
        - { name: category, in: query, schema: { $ref: '#/components/schemas/Category' } }
        - { name: sort, in: query, schema: { type: string, enum: [price, deliveryDays, rating], default: price } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/ComparisonRow' } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /distributors/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [Distributors]
      summary: Distributor profile
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Distributor' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /distributors/{id}/catalog:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [Catalog]
      summary: Available catalog items of a distributor (US-30)
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: q, in: query, schema: { type: string, maxLength: 80 } }
        - { name: category, in: query, schema: { $ref: '#/components/schemas/Category' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/CatalogItem' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------- Catalog (distributor side) ----------------
  /catalog:
    get:
      tags: [Catalog]
      summary: My distributor's catalog, including unavailable items (distributor_owner, distributor_staff) (US-30)
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: q, in: query, schema: { type: string, maxLength: 80 } }
        - { name: category, in: query, schema: { $ref: '#/components/schemas/Category' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/CatalogItem' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Catalog]
      summary: Create a catalog item (distributor_owner) (US-30)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CatalogItemInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogItem' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /catalog/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    patch:
      tags: [Catalog]
      summary: Update a catalog item (distributor_owner, own items only; send at least one field)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CatalogItemInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogItem' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Catalog]
      summary: Delete a catalog item (distributor_owner, own items only)
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------- Orders ----------------
  /orders:
    get:
      tags: [Orders]
      summary: Orders of my organization (store sees its orders; distributor sees orders addressed to it) (US-33, US-34)
      description: Store owner/inventory and distributor users; cashiers get 403. Newest first.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/OrderStatus' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/PurchaseOrder' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Orders]
      summary: Create a purchase order (store_owner, store_inventory) (US-32)
      description: Prices and total come from the distributor's available catalog; repeated items are merged. Notifies the distributor (`order_created`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PurchaseOrderInput' }
      responses:
        '201':
          description: Created with status pending
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseOrder' }
        '400':
          description: Validation error (unavailable or foreign item → `items.N.catalogItem`) or `BELOW_MINIMUM_ORDER`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /orders/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [Orders]
      summary: Order detail with status history (only the two organizations involved)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseOrder' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /orders/{id}/status:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    patch:
      tags: [Orders]
      summary: Change order status (rule BR5)
      description: |
        accepted / rejected → distributor_owner (from pending; reject needs `note`).
        shipped (from accepted), delivered (from shipped) → distributor_owner, distributor_staff.
        cancelled (from pending) → store_owner, store_inventory.
        Other transitions → 409 `INVALID_TRANSITION` (also when another user changed the status first); a role of the wrong side → 403.
        Each change is appended to `statusHistory` and notifies the other organization (`order_status`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [accepted, rejected, shipped, delivered, cancelled] }
                note: { type: string, maxLength: 300 }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseOrder' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /orders/{id}/receive:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      tags: [Orders]
      summary: Receive a delivered order into stock, once (store_owner, store_inventory) (US-35)
      description: In one transaction, adds each quantity to the store product with the same name (case-insensitive) or creates it (cost = unit price, price = cost × 1.3, SKU `PO-000123-N`). 409 before delivery or when already received.
      responses:
        '200':
          description: Received; returns the order with receivedAt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseOrder' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /orders/{id}/rating:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      tags: [Orders]
      summary: Rate the distributor of a delivered order, once (store_owner) (US-36)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stars]
              properties:
                stars: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string, maxLength: 300 }
      responses:
        '201':
          description: Rated; the distributor's ratingAverage and ratingCount are updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  stars: { type: integer }
                  comment: { type: string, nullable: true }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ---------------- Messages ----------------
  /orders/{id}/messages:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [Messages]
      summary: Messages of an order (polling; only the two organizations involved) (US-40)
      description: Store owner/inventory and distributor users of the order; cashiers 403, other organizations 404. Chronological, at most 500.
      parameters:
        - { name: after, in: query, schema: { type: string, format: date-time }, description: Return only messages newer than this }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Message' } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Messages]
      summary: Send a message on an order (plain text, trimmed; notifies the other organization with a `message` notification)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------- Notifications ----------------
  /notifications:
    get:
      tags: [Notifications]
      summary: My notifications, newest first (US-41)
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: unread, in: query, schema: { type: boolean } }
        - { name: type, in: query, schema: { type: string, enum: [low_stock, order_created, order_status, message, rating] }, description: Only this type (e.g. unread messages on the dashboards) }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      unreadCount: { type: integer }
                      data: { type: array, items: { $ref: '#/components/schemas/Notification' } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /notifications/{id}/read:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    patch:
      tags: [Notifications]
      summary: Mark one notification as read (404 if it belongs to another user)
      responses:
        '204': { description: Marked }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /notifications/read-all:
    post:
      tags: [Notifications]
      summary: Mark all my notifications as read
      responses:
        '204': { description: Marked }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: '^[a-f0-9]{24}$' }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Days:
      name: days
      in: query
      schema: { type: integer, enum: [7, 30, 90], default: 30 }

  responses:
    AuthOk:
      description: Authenticated
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Session'
              - type: object
                properties:
                  accessToken: { type: string }
                  tokenType: { type: string, example: Bearer }
                  expiresIn: { type: integer, example: 900 }
    ValidationError:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: VALIDATION_ERROR, message: Invalid input, details: [ { path: email, message: Invalid email } ] } }
    Unauthorized:
      description: Missing, invalid or expired token / invalid credentials
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: UNAUTHORIZED, message: Invalid credentials } }
    Forbidden:
      description: Authenticated but the role or organization is not allowed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: FORBIDDEN, message: You do not have permission to perform this action } }
    NotFound:
      description: Resource not found in your organization
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Conflict with the current state (duplicate, invalid transition, already done)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [VALIDATION_ERROR, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, CONFLICT, INSUFFICIENT_STOCK, BELOW_MINIMUM_ORDER, INVALID_TRANSITION, RATE_LIMITED, INTERNAL_ERROR]
            message: { type: string }
            details:
              type: array
              items:
                type: object
                properties:
                  path: { type: string }
                  message: { type: string }
    PageMeta:
      type: object
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
    Role:
      type: string
      enum: [store_owner, store_inventory, store_cashier, distributor_owner, distributor_staff]
    Category:
      type: string
      enum: [groceries, beverages, dairy, snacks, cleaning, personal_care, bakery, fruits_vegetables, meat, other]
    Unit:
      type: string
      enum: [unit, kg, g, l, ml, pack]
    PaymentMethod:
      type: string
      enum: [card, nequi, cash]
    OrderStatus:
      type: string
      enum: [pending, accepted, rejected, shipped, delivered, cancelled]

    User:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        orgType: { type: string, enum: [store, distributor] }
        orgId: { type: string }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
    Session:
      type: object
      properties:
        user: { $ref: '#/components/schemas/User' }
        organization:
          type: object
          properties:
            id: { type: string }
            type: { type: string, enum: [store, distributor] }
            name: { type: string }
    Password:
      type: string
      minLength: 8
      maxLength: 72
      pattern: '^(?=.*[A-Za-z])(?=.*\d).+$'
    RegisterStoreInput:
      type: object
      required: [name, email, password, store]
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        email: { type: string, format: email }
        password: { $ref: '#/components/schemas/Password' }
        store: { $ref: '#/components/schemas/StoreInput' }
    RegisterDistributorInput:
      type: object
      required: [name, email, password, distributor]
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        email: { type: string, format: email }
        password: { $ref: '#/components/schemas/Password' }
        distributor: { $ref: '#/components/schemas/DistributorInput' }
    CreateEmployeeInput:
      type: object
      required: [name, email, password, role]
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        email: { type: string, format: email }
        password: { $ref: '#/components/schemas/Password' }
        role: { type: string, enum: [store_inventory, store_cashier, distributor_staff] }

    StoreInput:
      type: object
      required: [name, address, phone]
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        address: { type: string, maxLength: 160 }
        phone: { type: string, pattern: '^\d{7,15}$' }
    Store:
      allOf:
        - type: object
          properties:
            id: { type: string }
        - $ref: '#/components/schemas/StoreInput'
    DistributorInput:
      type: object
      required: [name, nit, phone, coverageArea, deliveryDays, minimumOrder]
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        nit: { type: string, pattern: '^\d{6,12}(-\d)?$' }
        phone: { type: string, pattern: '^\d{7,15}$' }
        coverageArea: { type: string, maxLength: 120 }
        deliveryDays: { type: integer, minimum: 1, maximum: 30 }
        minimumOrder: { type: integer, minimum: 0 }
    Distributor:
      allOf:
        - type: object
          properties:
            id: { type: string }
            categories: { type: array, items: { $ref: '#/components/schemas/Category' } }
            ratingAverage: { type: number, minimum: 0, maximum: 5 }
            ratingCount: { type: integer }
        - $ref: '#/components/schemas/DistributorInput'

    ProductInput:
      type: object
      required: [name, sku, category, unit, price]
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        sku: { type: string, maxLength: 30 }
        category: { $ref: '#/components/schemas/Category' }
        unit: { $ref: '#/components/schemas/Unit' }
        price: { type: integer, minimum: 1 }
        cost: { type: integer, minimum: 0 }
        stock: { type: integer, minimum: 0, description: Initial stock (create only) }
        minStock: { type: integer, minimum: 0, default: 5 }
    StockMovement:
      type: object
      properties:
        id: { type: string }
        type: { type: string, enum: [adjustment, sale, order_received, void] }
        quantity: { type: integer, description: 'Signed: negative = out' }
        stockAfter: { type: integer }
        reason: { type: string, enum: [count, damage, other], nullable: true }
        note: { type: string, nullable: true }
        user:
          type: object
          nullable: true
          properties:
            id: { type: string }
            name: { type: string }
        createdAt: { type: string, format: date-time }
    ProductUpdateInput:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        sku: { type: string, maxLength: 30 }
        category: { $ref: '#/components/schemas/Category' }
        unit: { $ref: '#/components/schemas/Unit' }
        price: { type: integer, minimum: 1 }
        cost: { type: integer, minimum: 0 }
        minStock: { type: integer, minimum: 0 }
    Product:
      allOf:
        - type: object
          properties:
            id: { type: string }
            stock: { type: integer }
            lowStock: { type: boolean, description: 'stock <= minStock' }
            active: { type: boolean }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
        - $ref: '#/components/schemas/ProductInput'

    SaleInput:
      type: object
      required: [items, paymentMethod]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [product, quantity]
            properties:
              product: { type: string, description: Product id }
              quantity: { type: integer, minimum: 1 }
        paymentMethod: { $ref: '#/components/schemas/PaymentMethod' }
        amountReceived: { type: integer, minimum: 0, description: 'Required and >= total when paymentMethod is cash; not allowed otherwise. Prices and totals sent by the client are ignored.' }
    Sale:
      type: object
      properties:
        id: { type: string }
        items:
          type: array
          items:
            type: object
            properties:
              product: { type: string }
              name: { type: string, description: Snapshot at sale time }
              sku: { type: string }
              quantity: { type: integer }
              unitPrice: { type: integer, description: Snapshot at sale time }
              subtotal: { type: integer }
        total: { type: integer, description: Always computed by the server }
        paymentMethod: { $ref: '#/components/schemas/PaymentMethod' }
        amountReceived: { type: integer, nullable: true, description: Cash only }
        change: { type: integer, nullable: true, description: Cash only }
        cashier:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
        createdAt: { type: string, format: date-time }
        voidedAt: { type: string, format: date-time, nullable: true, description: Set when the owner voided the sale }
        voidReason: { type: string, nullable: true }
    DailySummary:
      type: object
      properties:
        date: { type: string, format: date }
        byMethod:
          type: array
          items:
            type: object
            properties:
              method: { $ref: '#/components/schemas/PaymentMethod' }
              total: { type: integer }
              count: { type: integer }
        grandTotal: { type: integer }
        salesCount: { type: integer }

    ProductStat:
      type: object
      properties:
        product: { type: string }
        name: { type: string }
        units: { type: integer }
        revenue: { type: integer }
    RestockSuggestion:
      type: object
      properties:
        product: { type: string }
        name: { type: string }
        sku: { type: string }
        category: { $ref: '#/components/schemas/Category' }
        unit: { $ref: '#/components/schemas/Unit' }
        stock: { type: integer }
        minStock: { type: integer }
        avgDaily: { type: number }
        daysLeft: { type: number, nullable: true, description: null when there are no sales }
        leadTimeDays: { type: integer }
        suggestedQty: { type: integer }
        urgent: { type: boolean }
        bestDistributor:
          type: object
          nullable: true
          properties:
            id: { type: string }
            name: { type: string }
            price: { type: integer }
            catalogItem: { type: string, description: Cheapest matching catalog item (used to prefill a new order) }

    CatalogItemInput:
      type: object
      required: [name, category, unit, price]
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        category: { $ref: '#/components/schemas/Category' }
        unit: { $ref: '#/components/schemas/Unit' }
        price: { type: integer, minimum: 1 }
        available: { type: boolean, default: true }
    CatalogItem:
      allOf:
        - type: object
          required: [id, distributor, available]
          properties:
            id: { type: string }
            distributor: { type: string }
        - $ref: '#/components/schemas/CatalogItemInput'
    ComparisonRow:
      type: object
      properties:
        distributor:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            deliveryDays: { type: integer }
            minimumOrder: { type: integer }
            ratingAverage: { type: number }
            ratingCount: { type: integer }
            coverageArea: { type: string }
        item:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            unit: { $ref: '#/components/schemas/Unit' }
            price: { type: integer }

    PurchaseOrderInput:
      type: object
      required: [distributor, items]
      properties:
        distributor: { type: string }
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [catalogItem, quantity]
            properties:
              catalogItem: { type: string }
              quantity: { type: integer, minimum: 1 }
        note: { type: string, maxLength: 300 }
    PurchaseOrder:
      type: object
      properties:
        id: { type: string }
        code: { type: string, example: PO-000123 }
        store: { type: object, properties: { id: { type: string }, name: { type: string } } }
        distributor: { type: object, properties: { id: { type: string }, name: { type: string } } }
        items:
          type: array
          items:
            type: object
            properties:
              catalogItem: { type: string }
              name: { type: string }
              unit: { $ref: '#/components/schemas/Unit' }
              category: { $ref: '#/components/schemas/Category' }
              quantity: { type: integer }
              unitPrice: { type: integer }
              subtotal: { type: integer }
        total: { type: integer }
        status: { $ref: '#/components/schemas/OrderStatus' }
        statusHistory:
          type: array
          items:
            type: object
            properties:
              status: { $ref: '#/components/schemas/OrderStatus' }
              at: { type: string, format: date-time }
              by: { type: object, properties: { id: { type: string }, name: { type: string } } }
              note: { type: string, nullable: true }
        note: { type: string, nullable: true }
        rejectReason: { type: string, nullable: true }
        receivedAt: { type: string, format: date-time, nullable: true }
        rated: { type: boolean }
        createdAt: { type: string, format: date-time }

    Message:
      type: object
      properties:
        id: { type: string }
        order: { type: string }
        sender: { type: object, properties: { id: { type: string }, name: { type: string }, orgType: { type: string, enum: [store, distributor] } } }
        text: { type: string }
        createdAt: { type: string, format: date-time }
    Notification:
      type: object
      properties:
        id: { type: string }
        type: { type: string, enum: [low_stock, order_created, order_status, message, rating] }
        title: { type: string }
        body: { type: string }
        link: { type: string }
        read: { type: boolean }
        createdAt: { type: string, format: date-time }
